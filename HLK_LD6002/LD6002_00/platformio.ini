; mmwave6002/HLK_LD6002/LD6002_00 — HLK-LD6002 60GHz vital-signs radar on ESP32.
;
; Phase 1 (current): raw UART sniffer. LD6002's documented default is
; 1,382,400 baud — too fast for a generic CP210x USB-serial bridge on a PC
; (confirmed: silent failures, all-zero readback). ESP32's hardware UART has
; no such ceiling, so this reads it directly and hex-dumps every byte to the
; USB serial monitor with timestamps and idle-gap markers, so the real frame
; format can be reverse-engineered from an actual capture.
;
; board=denky32 to match the sibling HLK_LD2450/LD2450_00 project (and the
; IOT_Server fleet) — same physical board type, and GPIO16/17 below match
; that project's radar.begin(...) pins, so an existing LD2450 wiring harness
; should plug in unchanged.

[env:denky32]
platform  = espressif32
board     = denky32
framework = arduino
monitor_speed = 115200
